<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClubLog</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="phone-shell">
      <section id="loginView" class="login-view" aria-labelledby="loginTitle">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">CL</span>
          <div>
            <p class="eyebrow">Internal Club App</p>
            <h1 id="loginTitle">ClubLog</h1>
          </div>
        </div>

        <form id="loginForm" class="panel stack">
          <label>
            社員ID
            <input name="employeeId" autocomplete="username" placeholder="E1001" required>
          </label>
          <label>
            パスワード
            <input name="password" type="password" autocomplete="current-password" placeholder="demo123" required>
          </label>
          <button class="primary-btn" type="submit">ログイン</button>
          <p id="loginMessage" class="form-message" role="status"></p>
        </form>

        <div class="demo-note">
          <p>デモ: E1001 / demo123</p>
          <p>SmartHR 同期はプロフィールから確認できます。</p>
        </div>
      </section>

      <section id="appView" class="app-view" hidden>
        <header class="app-header">
          <div>
            <p id="currentDate" class="eyebrow"></p>
            <h2 id="screenTitle">ホーム</h2>
          </div>
          <button id="logoutButton" class="icon-btn" type="button" aria-label="ログアウト" title="ログアウト">⎋</button>
        </header>

        <div class="content-scroll">
          <section id="homeScreen" class="screen active" data-title="ホーム">
            <div class="welcome-band">
              <div>
                <p class="eyebrow">本日のログイン</p>
                <h3 id="welcomeName"></h3>
                <p id="welcomeMeta"></p>
              </div>
              <span id="clubCountBadge" class="metric-badge"></span>
            </div>

            <div class="section-title">
              <h3>最新活動</h3>
              <button class="text-btn" type="button" data-goto="records">見る</button>
            </div>
            <div id="latestRecords" class="record-list"></div>
            <button id="homeRecordButton" class="home-fab" type="button" aria-label="活動記録を登録">＋</button>
          </section>

          <section id="clubsScreen" class="screen" data-title="部活">
            <div class="club-filter" role="tablist" aria-label="所属部活"></div>
            <div id="clubDetails" class="club-details"></div>
          </section>

          <section id="recordsScreen" class="screen" data-title="活動記録">
            <form id="recordForm" class="panel stack compact-form">
              <div class="two-col">
                <label>
                  部活
                  <select name="club" required></select>
                </label>
                <label>
                  日付
                  <input name="date" type="date" required>
                </label>
              </div>
              <label>
                タイトル
                <input name="title" maxlength="50" placeholder="朝練と交流戦" required>
              </label>
              <label>
                本文
                <textarea name="body" rows="4" maxlength="400" placeholder="活動内容や次回へのメモ" required></textarea>
              </label>
              <label>
                写真
                <input name="photo" type="file" accept="image/*" multiple>
              </label>
              <button class="primary-btn" type="submit">記録する</button>
              <p id="recordMessage" class="form-message" role="status"></p>
            </form>
            <div id="recordList" class="record-list full"></div>
          </section>

          <section id="recordDetailScreen" class="screen" data-title="活動詳細">
            <div id="recordDetail" class="record-detail"></div>
          </section>

          <section id="scheduleScreen" class="screen" data-title="日程調整">
            <form id="scheduleForm" class="panel stack compact-form">
              <div class="two-col">
                <label>
                  部活
                  <select name="club" required></select>
                </label>
                <label>
                  候補日
                  <input name="date" type="date" required>
                </label>
              </div>
              <label>
                時間
                <input name="time" type="time" required>
              </label>
              <label>
                メッセージ
                <textarea name="message" rows="3" maxlength="160" placeholder="集合場所や持ち物"></textarea>
              </label>
              <button class="primary-btn" type="submit">候補を追加</button>
              <p id="scheduleMessage" class="form-message" role="status"></p>
            </form>
            <div id="scheduleList" class="schedule-list"></div>
          </section>

          <section id="profileScreen" class="screen" data-title="マイページ">
            <div class="profile-card panel">
              <div class="avatar" id="profileInitial"></div>
              <div>
                <h3 id="profileName"></h3>
                <p id="profileMeta"></p>
              </div>
            </div>

            <form id="profileForm" class="panel stack compact-form">
              <label>
                名前
                <input name="name" required>
              </label>
              <label>
                所属事業部
                <input name="division" required>
              </label>
              <label>
                所属店舗
                <input name="store" required>
              </label>
              <fieldset>
                <legend>所属部活</legend>
                <div id="clubCheckboxes" class="checkbox-grid"></div>
              </fieldset>
              <button class="primary-btn" type="submit">更新</button>
              <p id="profileMessage" class="form-message" role="status"></p>
            </form>

            <div class="panel stack">
              <div class="section-title flush">
                <h3>SmartHR</h3>
                <span id="smartHrStatus" class="status-pill"></span>
              </div>
              <label>
                テナントサブドメイン
                <input id="tenantInput" placeholder="example">
              </label>
              <button id="smartHrSyncButton" class="secondary-btn" type="button">社員情報を同期</button>
              <p id="smartHrMessage" class="form-message"></p>
            </div>
          </section>
        </div>

        <nav class="bottom-nav" aria-label="主要ナビゲーション">
          <button class="nav-btn active" type="button" data-screen="homeScreen" aria-label="ホーム">
            <span aria-hidden="true">⌂</span><small>ホーム</small>
          </button>
          <button class="nav-btn" type="button" data-screen="clubsScreen" aria-label="部活">
            <span aria-hidden="true">□</span><small>部活</small>
          </button>
          <button class="nav-btn" type="button" data-screen="recordsScreen" aria-label="記録">
            <span aria-hidden="true">＋</span><small>記録</small>
          </button>
          <button class="nav-btn" type="button" data-screen="scheduleScreen" aria-label="日程">
            <span aria-hidden="true">◷</span><small>日程</small>
          </button>
          <button class="nav-btn" type="button" data-screen="profileScreen" aria-label="マイページ">
            <span aria-hidden="true">○</span><small>自分</small>
          </button>
        </nav>
      </section>
    </main>

    <template id="recordTemplate">
      <article class="record-card">
        <div class="record-photo"></div>
        <div class="record-body">
          <div class="record-head">
            <span class="club-pill"></span>
            <time></time>
          </div>
          <h4></h4>
          <p></p>
          <small></small>
        </div>
      </article>
    </template>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
